openapi: 3.0.3
info:
  title: ISM API
  description: >-
    REST API for working with Intelligence Community Information Security
    Markings (IC-ISM). Provides reference data lookup, ISM validation,
    field-level guidance, and banner/portion-mark rendering.
  version: 0.1.0
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: health
    description: Service health checks
  - name: reference-data
    description: Compiled-in ISM reference data lookups
  - name: validation
    description: ISM object validation
  - name: guidance
    description: Field-level guidance for ISM form building
  - name: banner
    description: Banner line and portion mark rendering

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Health check
      description: Returns service health status. Response is raw JSON, not envelope-wrapped.
      tags: [health]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
              example:
                status: ok

  /api/v1/ref/classifications:
    get:
      operationId: getClassifications
      summary: List classification levels
      tags: [reference-data]
      responses:
        "200":
          description: Envelope-wrapped array of classification entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ClassificationEntry"
              example:
                data:
                  - code: U
                    label: UNCLASSIFIED
                    level: 0
                  - code: CUI
                    label: CUI
                    level: 1
                  - code: C
                    label: CONFIDENTIAL
                    level: 2
                  - code: S
                    label: SECRET
                    level: 3

  /api/v1/ref/cui-categories:
    get:
      operationId: getCUICategories
      summary: List CUI category markings
      tags: [reference-data]
      responses:
        "200":
          description: Envelope-wrapped array of CUI categories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CUICategory"
              example:
                data:
                  - code: SP-CTI
                    label: Controlled Technical Information
                    type: specified
                    description: Technical information with military or space application

  /api/v1/ref/dissemination-controls:
    get:
      operationId: getDisseminationControls
      summary: List dissemination controls
      tags: [reference-data]
      responses:
        "200":
          description: Envelope-wrapped array of dissemination controls
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/DisseminationControl"
              example:
                data:
                  - code: NOFORN
                    label: Not Releasable to Foreign Nationals
                    description: Information not releasable to foreign nationals

  /api/v1/ref/distribution-statements:
    get:
      operationId: getDistributionStatements
      summary: List distribution statements
      tags: [reference-data]
      responses:
        "200":
          description: Envelope-wrapped array of distribution statements
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/DistributionStatement"
              example:
                data:
                  - code: A
                    label: Distribution Statement A
                    text: Approved for public release; distribution is unlimited.

  /api/v1/ref/country-codes:
    get:
      operationId: getCountryCodes
      summary: List country, coalition, and organization codes
      tags: [reference-data]
      responses:
        "200":
          description: Envelope-wrapped array of country codes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CountryCode"
              example:
                data:
                  - code: USA
                    name: United States
                    type: country
                  - code: FVEY
                    name: Five Eyes
                    type: coalition

  /api/v1/ref/declass-exceptions:
    get:
      operationId: getDeclassExceptions
      summary: List declassification exception codes
      tags: [reference-data]
      responses:
        "200":
          description: Envelope-wrapped array of declass exceptions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/DeclassException"
              example:
                data:
                  - code: 25X1
                    label: 25X1 — Human intelligence sources
                    category: intelligence

  /api/v1/ref/non-ic-markings:
    get:
      operationId: getNonICMarkings
      summary: List non-IC markings
      tags: [reference-data]
      responses:
        "200":
          description: Envelope-wrapped array of non-IC markings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/NonICMarking"
              example:
                data:
                  - code: LIMDIS
                    label: Limited Distribution

  /api/v1/validate:
    post:
      operationId: validateISM
      summary: Validate a complete ISM object
      description: >-
        Runs all validation rules against a complete ISM object. Returns HTTP 200
        for both valid and invalid ISM; 400 for malformed requests.
      tags: [validation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ism]
              properties:
                ism:
                  $ref: "#/components/schemas/ISM"
            example:
              ism:
                classification: S
                ownerProducer: [USA]
                classifiedBy: John Smith
                classificationReason: Contains intelligence sources
                declassDate: "2035-06-15"
      responses:
        "200":
          description: Envelope-wrapped validation result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ValidationResult"
              example:
                data:
                  valid: true
                  errors: []
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                errors:
                  - message: "malformed request: invalid character '}' after top-level value"

  /api/v1/validate/portion:
    post:
      operationId: validatePortion
      summary: Validate a portion-level ISM object
      description: >-
        Runs validation against a portion-level ISM. Same engine as full
        validation — rules self-select based on what fields are present.
      tags: [validation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ism]
              properties:
                ism:
                  $ref: "#/components/schemas/ISM"
            example:
              ism:
                classification: C
                ownerProducer: [USA]
                disseminationControls: [NOFORN]
      responses:
        "200":
          description: Envelope-wrapped validation result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ValidationResult"
              example:
                data:
                  valid: true
                  errors: []
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                errors:
                  - message: "malformed request: invalid character '}' after top-level value"

  /api/v1/guidance:
    post:
      operationId: getGuidance
      summary: Get field-level guidance for a partial ISM
      description: >-
        Returns field-level guidance for building ISM forms. Given partial ISM
        state, reports which fields are available, required, locked, or not
        applicable, along with their allowed values.
      tags: [guidance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ism]
              properties:
                ism:
                  $ref: "#/components/schemas/ISM"
            example:
              ism:
                classification: S
                ownerProducer: [USA]
      responses:
        "200":
          description: Envelope-wrapped guidance response with field array
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          fields:
                            type: array
                            items:
                              $ref: "#/components/schemas/FieldGuidance"
              example:
                data:
                  fields:
                    - field: classifiedBy
                      status: required
                      required: true
                      allowedValues: []
                      reason: SECRET classification requires an original classification authority
                    - field: disseminationControls
                      status: available
                      required: false
                      allowedValues:
                        - code: NOFORN
                          label: Not Releasable to Foreign Nationals
                        - code: REL
                          label: Authorized for Release To
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                errors:
                  - message: "malformed request: invalid character '}' after top-level value"

  /api/v1/banner:
    post:
      operationId: renderBanner
      summary: Render banner line and portion mark
      description: >-
        Renders the banner line, portion mark, and authority block for a given
        ISM object. Follows IC banner ordering rules.
      tags: [banner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ism]
              properties:
                ism:
                  $ref: "#/components/schemas/ISM"
            example:
              ism:
                classification: S
                ownerProducer: [USA]
                disseminationControls: [NOFORN]
                classifiedBy: John Smith
                classificationReason: Contains intelligence sources
                declassDate: "2035-06-15"
      responses:
        "200":
          description: Envelope-wrapped banner result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BannerResult"
              example:
                data:
                  bannerLine: SECRET//NOFORN
                  portionMark: (S//NF)
                  authorityBlock: |-
                    Classified By: John Smith
                    Reason: Contains intelligence sources
                    Declassify On: 2035-06-15
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                errors:
                  - message: "malformed request: invalid character '}' after top-level value"

components:
  schemas:
    Envelope:
      type: object
      description: Standard response wrapper for all API endpoints (except /healthz).
      properties:
        data:
          description: The response payload. Null or absent on error responses.
        errors:
          type: array
          description: Error details. Absent on success responses.
          items:
            $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      description: A single error in the envelope errors array.
      properties:
        message:
          type: string
          description: Human-readable error message
      required: [message]

    ISM:
      type: object
      description: >-
        The core Information Security Marking object per the json-ism spec.
        Fields map to IC-ISM XML attributes for REST API consumption.
      properties:
        version:
          type: string
          description: ISM specification version
        classification:
          type: string
          description: Classification level code
          enum: [U, CUI, C, S]
        ownerProducer:
          type: array
          items:
            type: string
          description: Originating country/organization codes
        joint:
          type: boolean
          description: Whether this is a joint product
          default: false
        categoryMarkings:
          type: array
          items:
            type: string
          description: CUI category marking codes
        controlledByName:
          type: string
          description: Name of the controlling authority (CUI)
        controlledByOffice:
          type: string
          description: Office of the controlling authority (CUI)
        poc:
          type: string
          description: Point of contact (CUI)
        disseminationControls:
          type: array
          items:
            type: string
          description: Dissemination control codes (e.g. NOFORN, REL)
        releasableTo:
          type: array
          items:
            type: string
          description: Country codes for REL TO dissemination
        displayOnlyTo:
          type: array
          items:
            type: string
          description: Country codes for DISPLAY ONLY dissemination
        distributionStatement:
          type: string
          description: Distribution statement code (A-F, X)
        3rdPartyDistributionStatement:
          type: string
          description: Third-party distribution statement text
        3rdPartyDistributionWarning:
          type: string
          description: Third-party distribution warning text
        3rdPartyDistributionContract:
          $ref: "#/components/schemas/ThirdPartyDistributionContract"
        copyright:
          type: string
          description: Copyright notice text
        classifiedBy:
          type: string
          description: Original classification authority name
        classificationReason:
          type: string
          description: Reason for original classification
        derivativelyClassifiedBy:
          type: string
          description: Derivative classification authority name
        derivedFrom:
          type: string
          description: Source document for derivative classification
        compilationReason:
          type: string
          description: Reason for compilation classification
        declassDate:
          type: string
          description: Declassification date (YYYY-MM-DD)
        declassEvent:
          type: string
          description: Declassification event description
        declassException:
          type: string
          description: Declassification exception code (25X1, etc.)
        fgiSourceOpen:
          type: array
          items:
            type: string
          description: Open FGI source country codes
        fgiSourceProtected:
          type: array
          items:
            type: string
          description: Protected FGI source country codes
        nonICMarkings:
          type: array
          items:
            type: string
          description: Non-IC marking codes
        nonUSControls:
          type: array
          items:
            type: string
          description: Non-US control marking codes
        bannerLine:
          type: string
          description: Pre-computed banner line (if already rendered)
      required: [classification]

    ThirdPartyDistributionContract:
      type: object
      description: Contractor IP rights information for third-party distribution.
      properties:
        contractNumber:
          type: string
          description: Contract number
        contractorName:
          type: string
          description: Contractor name
        contractorAddress:
          type: string
          description: Contractor address
        expirationDate:
          type: string
          description: Contract expiration date
      required: [contractNumber, contractorName, contractorAddress, expirationDate]

    ClassificationEntry:
      type: object
      description: Reference data entry for a classification level.
      properties:
        code:
          type: string
          description: Classification code
          enum: [U, CUI, C, S]
        label:
          type: string
          description: Human-readable label
        level:
          type: integer
          description: Numeric ordering (0=least restrictive)
      required: [code, label, level]

    CUICategory:
      type: object
      description: Reference data entry for a CUI category marking.
      properties:
        code:
          type: string
          description: Category code
        label:
          type: string
          description: Human-readable label
        type:
          type: string
          description: Category type
          enum: [specified, basic]
        description:
          type: string
          description: Category description
      required: [code, label, type, description]

    DisseminationControl:
      type: object
      description: Reference data entry for a dissemination control.
      properties:
        code:
          type: string
          description: Control code (e.g. NOFORN, REL)
        label:
          type: string
          description: Human-readable label
        description:
          type: string
          description: Control description
        requiresField:
          type: string
          description: ISM field required when this control is used
        minClassification:
          type: string
          description: Minimum classification level for this control
          enum: [U, CUI, C, S]
        exclusiveWith:
          type: array
          items:
            type: string
          description: Controls that cannot be combined with this one
      required: [code, label, description]

    DistributionStatement:
      type: object
      description: Reference data entry for a distribution statement (DoDI 5230.24).
      properties:
        code:
          type: string
          description: Statement code (A-F, X)
        label:
          type: string
          description: Human-readable label
        text:
          type: string
          description: Full statement text
        classificationConstraint:
          type: string
          description: Classification constraint for this statement
      required: [code, label, text]

    CountryCode:
      type: object
      description: Reference data entry for a country, coalition, or organization.
      properties:
        code:
          type: string
          description: Country/org code (e.g. USA, FVEY)
        name:
          type: string
          description: Full name
        type:
          type: string
          description: Entity type
          enum: [country, coalition, organization]
      required: [code, name, type]

    DeclassException:
      type: object
      description: Reference data entry for a 25X declassification exemption.
      properties:
        code:
          type: string
          description: Exception code (e.g. 25X1)
        label:
          type: string
          description: Human-readable label
        category:
          type: string
          description: Exception category
      required: [code, label, category]

    NonICMarking:
      type: object
      description: Reference data entry for a non-IC marking.
      properties:
        code:
          type: string
          description: Marking code
        label:
          type: string
          description: Human-readable label
      required: [code, label]

    ValidationResult:
      type: object
      description: Aggregated validation findings for an ISM object.
      properties:
        valid:
          type: boolean
          description: Whether the ISM object passed all validation rules
        errors:
          type: array
          description: Validation findings (both errors and warnings)
          items:
            $ref: "#/components/schemas/FieldError"
      required: [valid]

    FieldError:
      type: object
      description: A single validation finding tied to a specific field.
      properties:
        field:
          type: string
          description: JSON field path that triggered the finding
        code:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable error message
        severity:
          type: string
          description: Finding severity
          enum: [error, warning]
      required: [field, code, message, severity]

    FieldGuidance:
      type: object
      description: Current state and valid options for a single ISM field.
      properties:
        field:
          type: string
          description: ISM field name
        status:
          type: string
          description: Current applicability of the field
          enum: [available, required, not_applicable, locked]
        required:
          type: boolean
          description: Whether the field is currently required
        requiredIf:
          type: string
          description: Condition under which the field becomes required
        allowedValues:
          type: array
          description: Valid options for this field
          items:
            $ref: "#/components/schemas/AllowedValue"
        reason:
          type: string
          description: Explanation for the current field status
      required: [field, status]

    AllowedValue:
      type: object
      description: A single valid option for a guidance field.
      properties:
        code:
          type: string
          description: Value code
        label:
          type: string
          description: Human-readable label
        type:
          type: string
          description: Value type (context-dependent)
      required: [code, label]

    BannerResult:
      type: object
      description: Rendered banner line, portion mark, and authority block.
      properties:
        bannerLine:
          type: string
          description: Full banner line (e.g. SECRET//NOFORN)
        portionMark:
          type: string
          description: Abbreviated portion mark (e.g. (S//NF))
        authorityBlock:
          type: string
          description: Classification authority block text (empty for U/CUI)
      required: [bannerLine, portionMark, authorityBlock]
